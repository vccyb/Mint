<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#faf8f3"/>
  <!-- Central tech stack visual - horizontal bands -->
  <rect x="100" y="100" width="1080" height="80" rx="8" fill="#183a4a" opacity="0.8"/>
  <rect x="100" y="200" width="1080" height="80" rx="8" fill="#183a4a" opacity="0.6"/>
  <rect x="100" y="300" width="1080" height="80" rx="8" fill="#183a4a" opacity="0.45"/>
  <rect x="100" y="400" width="520" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="660" y="400" width="520" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="100" y="500" width="340" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="470" y="500" width="340" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="840" y="500" width="340" height="80" rx="8" fill="#d8894f" fill-opacity="0.12" stroke="#d8894f" stroke-width="1.5"/>
  <!-- Small decorative dots -->
  <circle cx="140" cy="140" r="8" fill="#faf8f3" opacity="0.5"/>
  <circle cx="170" cy="140" r="8" fill="#d8894f" opacity="0.5"/>
  <circle cx="140" cy="240" r="8" fill="#faf8f3" opacity="0.4"/>
  <circle cx="170" cy="240" r="8" fill="#eef7f3" opacity="0.6"/>
  <!-- Layer separator lines -->
  <line x1="100" y1="190" x2="1180" y2="190" stroke="#183a4a" stroke-width="0.5" opacity="0.2"/>
  <line x1="100" y1="290" x2="1180" y2="290" stroke="#183a4a" stroke-width="0.5" opacity="0.2"/>
  <line x1="100" y1="390" x2="1180" y2="390" stroke="#183a4a" stroke-width="0.5" opacity="0.2"/>
  <!-- Connection indicators -->
  <rect x="550" y="620" width="180" height="50" rx="8" fill="#183a4a" opacity="0.15" stroke="#183a4a" stroke-width="1"/>
  <line x1="640" y1="580" x2="640" y2="620" stroke="#183a4a" stroke-width="1.5" opacity="0.3"/>
  <!-- Subtle grid dots -->
  <circle cx="1200" cy="120" r="3" fill="#183a4a" opacity="0.1"/>
  <circle cx="1200" cy="150" r="3" fill="#183a4a" opacity="0.1"/>
  <circle cx="1200" cy="180" r="3" fill="#183a4a" opacity="0.1"/>
  <circle cx="1200" cy="220" r="3" fill="#183a4a" opacity="0.1"/>
  <circle cx="1200" cy="250" r="3" fill="#183a4a" opacity="0.1"/>
  <circle cx="1200" cy="280" r="3" fill="#183a4a" opacity="0.1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#faf8f3"/>
  <!-- Lead agent (center top) -->
  <circle cx="640" cy="140" r="50" fill="#183a4a" opacity="0.15" stroke="#183a4a" stroke-width="2"/>
  <rect x="610" y="125" width="60" height="30" rx="4" fill="#183a4a" opacity="0.4"/>
  <!-- Connection lines from lead to workers -->
  <line x1="590" y1="180" x2="200" y2="340" stroke="#183a4a" stroke-width="1.5" opacity="0.4"/>
  <line x1="615" y1="185" x2="440" y2="340" stroke="#183a4a" stroke-width="1.5" opacity="0.4"/>
  <line x1="640" y1="190" x2="640" y2="340" stroke="#183a4a" stroke-width="1.5" opacity="0.4"/>
  <line x1="665" y1="185" x2="840" y2="340" stroke="#183a4a" stroke-width="1.5" opacity="0.4"/>
  <line x1="690" y1="180" x2="1080" y2="340" stroke="#183a4a" stroke-width="1.5" opacity="0.4"/>
  <!-- Worker cards -->
  <rect x="120" y="340" width="160" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="360" y="340" width="160" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="560" y="340" width="160" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="760" y="340" width="160" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="1000" y="340" width="160" height="80" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <!-- Worker icons -->
  <circle cx="200" cy="365" r="12" fill="#183a4a" opacity="0.3"/>
  <circle cx="440" cy="365" r="12" fill="#183a4a" opacity="0.3"/>
  <circle cx="640" cy="365" r="12" fill="#183a4a" opacity="0.3"/>
  <circle cx="840" cy="365" r="12" fill="#183a4a" opacity="0.3"/>
  <circle cx="1080" cy="365" r="12" fill="#183a4a" opacity="0.3"/>
  <!-- Worker bars -->
  <rect x="140" y="388" width="120" height="12" rx="3" fill="#183a4a" opacity="0.2"/>
  <rect x="380" y="388" width="120" height="12" rx="3" fill="#183a4a" opacity="0.2"/>
  <rect x="580" y="388" width="120" height="12" rx="3" fill="#183a4a" opacity="0.2"/>
  <rect x="780" y="388" width="120" height="12" rx="3" fill="#d8894f" opacity="0.2"/>
  <rect x="1020" y="388" width="120" height="12" rx="3" fill="#183a4a" opacity="0.2"/>
  <!-- Inbox collection area -->
  <rect x="280" y="520" width="720" height="120" rx="12" fill="#d8894f" fill-opacity="0.08" stroke="#d8894f" stroke-width="1.5"/>
  <!-- Arrows from workers to inbox -->
  <line x1="200" y1="420" x2="400" y2="520" stroke="#d8894f" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="440" y1="420" x2="480" y2="520" stroke="#d8894f" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="640" y1="420" x2="640" y2="520" stroke="#d8894f" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="840" y1="420" x2="780" y2="520" stroke="#d8894f" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="1080" y1="420" x2="880" y2="520" stroke="#d8894f" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <!-- Inbox content blocks -->
  <rect x="320" y="550" width="180" height="50" rx="6" fill="#d8894f" opacity="0.3"/>
  <rect x="550" y="550" width="180" height="50" rx="6" fill="#d8894f" opacity="0.25"/>
  <rect x="780" y="550" width="180" height="50" rx="6" fill="#d8894f" opacity="0.2"/>
  <!-- Resume arrow -->
  <line x1="640" y1="640" x2="640" y2="700" stroke="#183a4a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="540" y="700" width="200" height="50" rx="8" fill="#183a4a" opacity="0.1" stroke="#183a4a" stroke-width="1.5"/>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#183a4a"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#faf8f3"/>
  <!-- Main stack boxes -->
  <rect x="80" y="80" width="1120" height="120" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="80" y="230" width="1120" height="100" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="80" y="360" width="1120" height="100" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="80" y="490" width="1120" height="100" rx="8" fill="#eef7f3" stroke="#183a4a" stroke-width="1.5"/>
  <rect x="80" y="620" width="1120" height="100" rx="8" fill="#d8894f" fill-opacity="0.15" stroke="#d8894f" stroke-width="1.5"/>
  <!-- Layer labels - abstract shapes -->
  <rect x="120" y="110" width="200" height="50" rx="6" fill="#183a4a" opacity="0.8"/>
  <rect x="380" y="110" width="140" height="50" rx="6" fill="#183a4a" opacity="0.6"/>
  <rect x="580" y="110" width="160" height="50" rx="6" fill="#183a4a" opacity="0.6"/>
  <rect x="820" y="110" width="140" height="50" rx="6" fill="#183a4a" opacity="0.6"/>
  <rect x="1020" y="110" width="140" height="50" rx="6" fill="#d8894f" opacity="0.6"/>
  <rect x="120" y="255" width="500" height="50" rx="6" fill="#183a4a" opacity="0.5"/>
  <rect x="660" y="255" width="500" height="50" rx="6" fill="#d8894f" opacity="0.5"/>
  <rect x="120" y="385" width="340" height="50" rx="6" fill="#183a4a" opacity="0.4"/>
  <rect x="500" y="385" width="340" height="50" rx="6" fill="#183a4a" opacity="0.4"/>
  <rect x="880" y="385" width="280" height="50" rx="6" fill="#d8894f" opacity="0.4"/>
  <rect x="120" y="515" width="1060" height="50" rx="6" fill="#183a4a" opacity="0.3"/>
  <rect x="120" y="645" width="1060" height="50" rx="6" fill="#d8894f" opacity="0.3"/>
  <!-- Arrows between layers -->
  <line x1="640" y1="200" x2="640" y2="230" stroke="#183a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="330" x2="640" y2="360" stroke="#183a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="460" x2="640" y2="490" stroke="#183a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="590" x2="640" y2="620" stroke="#183a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#183a4a"/>
    </marker>
  </defs>
</svg>
